[package]
name = "mpegoat"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/findit-studio/mpegoat"
homepage = "https://github.com/findit-studio/mpegoat"
documentation = "https://docs.rs/mpegoat"
description = "A pure-Rust MPEG audio elementary-stream writer (MP1/MP2/MP3): streaming, constant memory, with the Xing/LAME frame and ID3 tags."
license = "MIT OR Apache-2.0"
rust-version = "1.95"
keywords = ["mpeg", "mp3", "id3", "audio", "muxer"]
categories = ["multimedia", "multimedia::audio", "multimedia::encoding", "parser-implementations", "no-std"]

[features]
default = ["std"]
alloc = []
std = ["alloc"]

[dependencies]

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
